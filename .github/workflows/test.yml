name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check question bank
        run: python skills/ielts-speaking-coach/scripts/coach.py bank-check
      - name: Test record behavior
        run: python -m unittest discover -s tests -v
      - name: Check generated prompt
        run: |
          python scripts/export_prompt.py
          git diff --exit-code -- dist/
